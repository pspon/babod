# Committed on purpose: these are deployment settings, not secrets.
# Secrets (if any) belong in .streamlit/secrets.toml, which stays ignored.

[server]
headless = true
address = "0.0.0.0"
port = 8501
# The Pi has no reason to watch the filesystem for edits; saves CPU and RAM.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#F5A524"
